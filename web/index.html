<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RIFAI ANNOUNCEMENT MANAGER</title>
  <base href="/dashboard/">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- ===================== LOGIN ===================== -->
  <section id="login-view" class="login-view">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">📢</div>
        <h1>RIFAI ANNOUNCEMENT MANAGER</h1>
        <p class="muted">Panel administrasi pengumuman WhatsApp</p>
      </div>
      <form id="login-form" autocomplete="off">
        <label for="login-password">Kata sandi admin</label>
        <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="Masukkan kata sandi">
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">Masuk</button>
      </form>
      <p id="login-notice" class="login-notice" hidden></p>
    </div>
  </section>

  <!-- ===================== APP ===================== -->
  <div id="app-view" class="app" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark small">📢</span>
        <div>
          <strong>RIFAI ANNOUNCEMENT MANAGER</strong>
          <span class="muted small-text">Otomatisasi pengumuman WhatsApp</span>
        </div>
      </div>
      <div class="topbar-right">
        <span id="wa-status" class="badge badge-muted">Memeriksa WhatsApp…</span>
        <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Keluar</button>
      </div>
      <div id="loading-bar" class="loading-bar" hidden></div>
    </header>

    <main class="main">
      <nav class="tabs" aria-label="Menu utama">
        <button class="tab active" type="button" data-tab="dashboard">Dashboard</button>
        <button class="tab" type="button" data-tab="create">Buat Pengumuman</button>
        <button class="tab" type="button" data-tab="schedules">Jadwal Otomatis</button>
        <button class="tab" type="button" data-tab="calendar">Kalender</button>
        <button class="tab" type="button" data-tab="history">Riwayat Pengiriman</button>
        <button class="tab" type="button" data-tab="groups">Grup WhatsApp</button>
        <button class="tab" type="button" data-tab="settings">Pengaturan</button>
        <span class="tab-divider" aria-hidden="true"></span>
        <button class="tab tab-tiny" type="button" data-tab="templates">Template</button>
        <button class="tab tab-tiny" type="button" data-tab="audit">Log Audit</button>
      </nav>

      <section id="tab-dashboard" class="tab-panel"></section>
      <section id="tab-create" class="tab-panel" hidden></section>
      <section id="tab-schedules" class="tab-panel" hidden></section>
      <section id="tab-calendar" class="tab-panel" hidden></section>
      <section id="tab-history" class="tab-panel" hidden></section>
      <section id="tab-groups" class="tab-panel" hidden></section>
      <section id="tab-settings" class="tab-panel" hidden></section>
      <section id="tab-templates" class="tab-panel" hidden></section>
      <section id="tab-audit" class="tab-panel" hidden></section>
    </main>
  </div>

  <!-- ===================== PREVIEW ===================== -->
  <div id="preview-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-preview"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="Preview pesan WhatsApp">
      <div class="modal-head">
        <h2>Preview pesan WhatsApp</h2>
        <button class="icon-btn" type="button" data-action="close-preview" aria-label="Tutup">✕</button>
      </div>
      <div class="modal-body">
        <div id="preview-image" class="preview-image"></div>
        <div id="preview-content" class="whatsapp-preview"></div>
        <div id="preview-meta" class="preview-meta"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" type="button" data-action="close-preview">Tutup</button>
      </div>
    </div>
  </div>

  <!-- ===================== KONFIRMASI ===================== -->
  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="confirm-cancel"></div>
    <div class="modal-dialog modal-sm" role="alertdialog" aria-modal="true" aria-label="Konfirmasi">
      <div class="modal-head"><h2 id="confirm-title">Konfirmasi</h2></div>
      <div class="modal-body"><p id="confirm-text"></p></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" type="button" data-action="confirm-cancel">Batal</button>
        <button class="btn btn-danger" type="button" id="confirm-ok">Ya, lanjutkan</button>
      </div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
